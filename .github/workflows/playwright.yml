name: E2E Tests

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize]

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        with:
          node-version: ">=22.23.4 <23"
          check-latest: true

      - run: yarn install --frozen-lockfile

      - name: Build chrome
        run: yarn build:chrome

      - name: Test Code
        # Keep tests on the patched runner Node, not the action's Node 18 image.
        run: xvfb-run --auto-servernum npx playwright test
        env:
          CI: "true"
          PUPPETEER_EXEC_PATH: "google-chrome-stable"

      - name: Artifact
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-artifcats
          path: |
            playwright-report/
            test-results/
          retention-days: 30
