name: Code quality - linting

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  linting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "yarn"

      - run: yarn install

      - name: Linting
        run: yarn lint:js

      - name: Prettier
        run: yarn format
